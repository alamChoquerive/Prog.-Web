
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Práctica A4_4</title>
</head>
<body>
    <h1>Buscar el número más repetido</h1>

    <div id="resultados">
        <p>Array original: <code>[1,1,2,3,3,4,4,4,5,5,6]</code></p>
        <p>Más repetido: <strong id="respuesta"></strong></p>
    </div>

    <script>
        const numeros = [1, 1, 2, 3, 3, 4, 4, 4, 5, 5, 6];

        // Contar la frecuencia de cada número
        const frecuencia = numeros.reduce((acc, num) => {
            acc[num] = (acc[num] || 0) + 1;
            return acc;
        }, {});

        // Encontrar el número con la mayor frecuencia
        let masRepetido = null;
        let max = -Infinity;
        for(const [valor, veces] of Object.entries(frecuencia)) {
            if (veces > max) {
                max = veces;
                masRepetido = number(valor);
            }
        }
        document.getElementById('respuesta').textContent = `${masRepetido} (repetido ${max} veces)`;
    </script>
</body>
</html>
