<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Practica A4_3</title>
</head>
<body>
    <h1>Resultado del Script</h1>
    
    <div id="resultados">
        <h2>1. Cubos de números pares:</h2>
        <p>Array original: [3, 6, 12, 15, 18]</p>
        <p>Números pares elevados al cubo: <span id="cubos"></span></p>
        
        <h2>2. Empleados por departamento:</h2>
        <pre id="empleados"></pre>
    </div>

    <script>
        //1
        const numeros = [3, 6, 12, 15, 18];
        const cubosPares = numeros
            .filter(num => num % 2 == 0) //filtra pares
            .map(num => num ** 3); //eleva al cubo

            document.getElementById("cubos").textContent = cubosPares.join(", ");

        //2
        const empleados = [
            { nombre: "Ana", departamento: "ventas" },
            { nombre: "Luis", departamento: "IT" },
            { nombre: "Marta", departamento: "ventas" },
            { nombre: "Pedro", departamento: "IT" },
            { nombre: "Sofía", departamento: "Marketing" }
        ];

        //Agrupar empleados por departamento
        const empleadosPorDepartamento = empleados.reduce((acc, empleado) => {
            if (!acc[empleado.departamento]) {
                acc[empleado.departamento] = [];
            }
            acc[empleado.departamento].push(empleado.nombre);
            return acc;
        }, {});

        // Mostrar los resultados
        document.getElementById("empleados").textContent = JSON.stringify(empleadosPorDepartamento, null, 2);

    </script>
</html>
</body>
